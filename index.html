<script>
const categories = {
    CAT01: "Control of Vehicle",
    CAT02: "Rules of the Road",
    CAT03: "Managing Risk",
    CAT04: "Safe and Social Responsible Driving",
    CAT05: "Technical Matters"
};

let questions = [];
let mode = '';
let currentQ = 0;
let timer = null;
let timeLeft = 60;
let answered = false;
let activeQuizQuestions = [];
let userAnswers = [];
let currentAudio = null;

async function loadQuestions() {
    try {
        const response = await fetch('questions-full.json');
        questions = await response.json();
        console.log("Questions loaded:", questions.length);
    } catch (error) {
        alert("Could not load questions-full.json");
        console.error(error);
    }
}

function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function doLogin() {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    if (username === 'fynah' && password === 'Fynah2026!') {
        show('home');
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
}

['usernameInput', 'passwordInput'].forEach(function(id) {
    document.getElementById(id).addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doLogin();
    });
});

function enterPracticeMode() {
    mode = 'practice';
    renderCategoryButtons();
    show('categorySelect');
}

function renderCategoryButtons() {
    const box = document.getElementById('categoryButtons');
    box.innerHTML = '';

    for (const key in categories) {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        btn.textContent = categories[key];
        btn.onclick = function() {
            choosePracticeCategory(key);
        };
        box.appendChild(btn);
    }
}

function choosePracticeCategory(categoryKey) {
    activeQuizQuestions = questions.filter(q => q.category === categoryKey);
    userAnswers = new Array(activeQuizQuestions.length).fill(null);
    currentQ = 0;
    show('quiz');
    loadQ();
}

function startQuiz(m) {
    mode = m;
    currentQ = 0;
    activeQuizQuestions = [...questions].sort(() => Math.random() - 0.5);
    userAnswers = new Array(activeQuizQuestions.length).fill(null);
    show('quiz');
    loadQ();
}

function loadQ() {
    const q = activeQuizQuestions[currentQ];
    answered = false;

    document.getElementById('qNum').textContent =
        'Q ' + (currentQ + 1) + '/' + activeQuizQuestions.length;

    document.getElementById('cat').textContent =
        categories[q.category] || q.category;

    document.getElementById('qText').textContent = q.questionEnglish;

    const qImage = document.getElementById('qImage');
    if (q.image && q.image.trim() !== '') {
        qImage.src = 'assets/images/' + q.image;
        qImage.style.display = 'block';
    } else {
        qImage.src = '';
        qImage.style.display = 'none';
    }

    const fb = document.getElementById('feedback');
    fb.className = 'feedback';
    document.getElementById('fbTitle').style.display = 'none';
    document.getElementById('fbText').style.display = 'none';
    document.getElementById('fbText').innerHTML = '';

    if (mode === 'test') {
        timeLeft = 60;
        document.getElementById('timer').style.display = 'inline';
        startTimer();
    } else {
        clearInterval(timer);
        document.getElementById('timer').style.display = 'none';
    }

    let html = '';
    q.optionsEnglish.forEach((opt, i) => {
        html += '<div class="option" onclick="selectAnswer(' + i + ')">';
        html += '<div class="opt-letter">' + String.fromCharCode(65 + i) + '</div>';
        html += '<div class="opt-text">' + opt + '</div>';
        html += '<button class="opt-audio" onclick="event.stopPropagation(); playOpt(' + i + ')">&#128266;</button>';
        html += '</div>';
    });

    document.getElementById('options').innerHTML = html;
    updateOptionSelection();
    updateActionButtons();
}

function startTimer() {
    clearInterval(timer);
    updateTimer();
    timer = setInterval(function() {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
            clearInterval(timer);
        }
    }, 1000);
}

function updateTimer() {
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    document.getElementById('timer').textContent =
        (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function selectAnswer(idx) {
    const q = activeQuizQuestions[currentQ];
    userAnswers[currentQ] = idx;
    answered = true;

    if (mode === 'practice') {
        const correct = idx === q.answer;
        updateOptionSelection();
        showPracticeFeedback(correct, q);
    } else {
        updateOptionSelection();
        updateActionButtons();
    }
}

function updateOptionSelection() {
    const selectedIndex = userAnswers[currentQ];
    const q = activeQuizQuestions[currentQ];

    document.querySelectorAll('.option').forEach((opt, i) => {
        opt.classList.remove('selected', 'correct', 'wrong');

        if (selectedIndex === i) opt.classList.add('selected');

        if (mode === 'practice' && selectedIndex !== null) {
            if (i === q.answer) opt.classList.add('correct');
            else if (i === selectedIndex) opt.classList.add('wrong');
        }
    });
}

function showPracticeFeedback(correct, q) {
    const fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');

    document.getElementById('fbTitle').style.display = 'block';
    document.getElementById('fbText').style.display = 'block';

    document.getElementById('fbTitle').textContent =
        correct ? 'Correct!' : 'Wrong!';

    document.getElementById('fbText').innerHTML =
        '<strong>Correct Answer:</strong> ' +
        q.optionsEnglish[q.answer] +
        '<br><br>' +
        q.explanationSomali;

    updateActionButtons();
}

function updateActionButtons() {
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const finishBtn = document.getElementById('finishBtn');

    nextBtn.style.display = 'none';
    finishBtn.style.display = 'none';

    if (mode === 'practice') {
        if (answered) {
            feedback.className += ' show';
            nextBtn.style.display = 'inline-block';
        }
    } else {
        if (userAnswers[currentQ] !== null) {
            feedback.className = 'feedback show';

            if (currentQ === activeQuizQuestions.length - 1) {
                finishBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
            }
        } else {
            feedback.className = 'feedback';
        }
    }
}

function nextQ() {
    currentQ++;

    if (currentQ >= activeQuizQuestions.length) {
        showResults();
    } else {
        loadQ();
    }
}

function finishTest() {
    showResults();
}

function showResults() {
    clearInterval(timer);
    show('results');

    const total = activeQuizQuestions.length;
    let score = 0;
    const breakdown = {};

    activeQuizQuestions.forEach((q, i) => {
        if (!breakdown[q.category]) {
            breakdown[q.category] = { correct: 0, total: 0 };
        }

        breakdown[q.category].total++;

        if (userAnswers[i] === q.answer) {
            score++;
            breakdown[q.category].correct++;
        }
    });

    const wrong = total - score;
    const pass = score >= Math.ceil(total * 0.8);

    document.getElementById('scoreCircle').textContent = score + '/' + total;
    document.getElementById('scoreCircle').className =
        'score-circle ' + (pass ? 'pass' : 'fail');

    document.getElementById('rTitle').textContent =
        pass ? 'PASSED 🎉' : 'FAILED ❌';

    document.getElementById('rMsg').textContent =
        'Correct: ' + score + ' | Wrong: ' + wrong + ' | Total: ' + total;

    let catHtml = '<h3 style="margin-bottom:15px;color:#1e3c72;">Category Breakdown</h3>';

    for (const cat in breakdown) {
        const cs = breakdown[cat];
        const w = cs.total - cs.correct;

        catHtml += '<div class="cat-result">';
        catHtml += '<div class="cat-name">' + (categories[cat] || cat) + '</div>';
        catHtml += '<div class="cat-stats">';
        catHtml += '<span style="color:#4caf50;">Correct: ' + cs.correct + '</span>';
        catHtml += '<span style="color:#f44336;">Wrong: ' + w + '</span>';
        catHtml += '<span style="color:#666;">Total: ' + cs.total + '</span>';
        catHtml += '</div></div>';
    }

    document.getElementById('categoryResults').innerHTML = catHtml;
}

function goHome() {
    clearInterval(timer);

    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    show('home');
}

function playAudio(src) {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    currentAudio = new Audio(src);
    currentAudio.play().catch(e => console.log('Audio error:', e));
}

function playQuestion() {
    const q = activeQuizQuestions[currentQ];
    playAudio('audio/q' + q.id + '_question.mp3');
}

function playOpt(idx) {
    const q = activeQuizQuestions[currentQ];
    playAudio('audio/q' + q.id + '_opt' + idx + '.mp3');
}

loadQuestions();
show('login');
</script>
