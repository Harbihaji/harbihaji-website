<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fynah Driving Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1e3c72;
            min-height: 100dvh;
            color: #333;
            overflow-x: hidden;
        }
        .container { width: 100%; max-width: 760px; margin: 0 auto; padding: 10px; }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Login */
        .login-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
            text-align: center;
        }
        .login-box h1 { color: #1e3c72; margin-bottom: 10px; font-size: 24px; }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #764ba2; }
        .error { color: red; margin-top: 10px; display: none; }

        /* Home */
        .home { text-align: center; padding: 18px 0; }
        .home h1 { color: white; margin-bottom: 16px; }
        .mode-btn {
            background: white;
            padding: 16px;
            border-radius: 15px;
            margin: 12px 0;
            cursor: pointer;
        }
        .mode-btn h2 { color: #1e3c72; margin-bottom: 6px; font-size: 18px; }
        .mode-btn p { color: #666; font-size: 13px; }

        /* Category Select */
        #categoryButtons { margin-bottom: 15px; }
        .category-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            color: #1e3c72;
            cursor: pointer;
        }
        .category-btn:hover { background: #eef3ff; }

        /* Quiz */
        .quiz-header {
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back { font-size: 24px; cursor: pointer; padding: 5px; }
        .timer { color: #e74c3c; font-weight: bold; font-size: 18px; }
        .q-card {
            background: white;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .cat {
            background: #e3f2fd;
            color: #1976d2;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .q-text { font-size: 18px; line-height: 1.35; font-weight: bold; margin-bottom: 8px; color: #1e3c72; }
        .q-image { width: 100%; max-height: 240px; object-fit: contain; border-radius: 12px; display: none; margin: 12px 0; }
        .audio-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        .audio-btn,
        .opt-audio {
            width: auto;
        }
        .option {
            background: #f5f5f5;
            padding: 11px;
            border-radius: 10px;
            margin: 7px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            min-height: 50px;
        }
        .option:hover { background: #e3f2fd; }
        .selected {
            background: #dce6ff !important;
            border: 2px solid #667eea;
        }
        .opt-letter {
            background: #1e3c72;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .opt-text { flex: 1; }
        .opt-audio {
            background: #ff9800;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 5px;
        }
        .correct { background: #c8e6c9 !important; }
        .wrong { background: #ffcdd2 !important; }

        .feedback {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            text-align: center;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #c8e6c9; color: #2e7d32; }
        .feedback.wrong { background: #ffcdd2; color: #c62828; }
        .feedback p { font-size: 15px; line-height: 1.4; margin-top: 8px; }

        #quizButtons { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        #quizButtons button { width: 100%; }

        /* Results */
        .results { text-align: center; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        .pass { background: #4caf50; }
        .fail { background: #f44336; }

        .cat-result {
            background: #f5f5f5;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            text-align: left;
        }
        .cat-name { font-weight: bold; color: #1e3c72; margin-bottom: 5px; }
        .cat-stats { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; }

        .watermark {
            position: fixed;
            bottom: 5px;
            right: 5px;
            opacity: 0.3;
            font-size: 10px;
            color: white;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .container { max-width: 100%; padding: 5px; }
            .q-card { padding: 8px; }
            .option { padding: 8px; min-height: 40px; }
            button { padding: 10px; font-size: 14px; }
            .q-text { font-size: 16px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="watermark">Fynah Driving School</div>

    <div class="container">
        <!-- LOGIN -->
        <div id="login" class="screen active">
            <div class="login-box">
                <h1>Fynah Driving Test</h1>
                <p style="color: #666; margin-bottom: 15px;">English with Somali Audio</p>
                <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
                <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
                <button onclick="doLogin()">ENTER</button>
                <p id="loginError" class="error">Invalid username or password</p>
            </div>
        </div>

        <!-- HOME -->
        <div id="home" class="screen">
            <h1 style="color: white; text-align: center; margin-bottom: 20px;">Choose Mode</h1>
            <div class="mode-btn" onclick="enterPracticeMode()">
                <h2>Practice Mode</h2>
                <p>No timer. Choose a category first.</p>
            </div>
            <div class="mode-btn" onclick="startQuiz('test')">
                <h2>Test Mode</h2>
                <p>10 mixed questions. Finish to view results.</p>
            </div>
        </div>

        <!-- CATEGORY SELECT -->
        <div id="categorySelect" class="screen">
            <h1 style="color:white; text-align:center; margin-bottom:15px;">Choose Category</h1>
            <div id="categoryButtons"></div>
            <button onclick="goHome()">Back Home</button>
        </div>

        <!-- QUIZ -->
        <div id="quiz" class="screen">
            <div class="quiz-header">
                <span class="back" onclick="goHome()">&#8592;</span>
                <span id="qNum">Q 1/10</span>
                <span class="timer" id="timer">01:00</span>
            </div>
            <div class="q-card">
                <span class="cat" id="cat">Category</span>
                <div class="q-text" id="qText">Question</div>
                <img id="qImage" class="q-image" src="" alt="Question image">
                <div style="text-align: center; margin: 12px 0;">
                    <button class="audio-btn" onclick="playQuestion()">Question Audio</button>
                </div>
                <div id="options"></div>
                <div id="feedback" class="feedback">
                    <h3 id="fbTitle">Correct!</h3>
                    <p id="fbText"></p>
                    <div id="quizButtons">
                        <button id="nextBtn" onclick="nextQ()">Next</button>
                        <button id="finishBtn" onclick="finishTest()" style="display:none;">Finish Test</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="results" class="screen">
            <div class="q-card">
                <div class="score-circle" id="scoreCircle">0/10</div>
                <h2 id="rTitle">Done!</h2>
                <p id="rMsg"></p>
                <div id="categoryResults" style="margin-top: 20px;"></div>
            </div>
            <button onclick="goHome()">Home</button>
            <button onclick="location.reload()" style="margin-top: 10px;">Restart</button>
        </div>
    </div>

    <script>
        const categories = {
            CAT01: "Control of Vehicle",
            CAT02: "Rules of the Road",
            CAT03: "Managing Risk",
            CAT04: "Safe and Social Responsible Driving",
            CAT05: "Technical Matters"
        };

        let questions = [];
            {
                id: 21,
                category: "CAT01",
                question: "What should you check before starting a long journey?",
                options: [
                    "Fuel only",
                    "Tires, oil and lights",
                    "Radio station",
                    "Car color"
                ],
                answer: 1,
                image: "",
                explanation: "Darawalku waa inuu hubiyaa taayirrada, saliidda iyo nalalka ka hor safar dheer si uu u xaqiijiyo in gaarigu ammaan yahay."
            },
            {
                id: 22,
                category: "CAT01",
                question: "What can reduce tire grip on wet roads?",
                options: [
                    "Low speed",
                    "Hydroplaning",
                    "Good brakes",
                    "Seatbelts"
                ],
                answer: 1,
                image: "",
                explanation: "Hydroplaning wuxuu dhaca marka taayirradu ka go'aan wadada sababtuna tahay biyaha, taasoo yareysa xajmiga."
            },
            {
                id: 23,
                category: "CAT02",
                question: "What does a continuous white line mean?",
                options: [
                    "Parking allowed",
                    "No overtaking",
                    "Bus lane",
                    "Road ending"
                ],
                answer: 1,
                image: "",
                explanation: "Xariiqda caddaanka ah ee joogtada ah badanaa waxay ka dhigan tahay in/wax la dhaafi karin."
            },
            {
                id: 24,
                category: "CAT02",
                question: "What should you do at a yellow box junction?",
                options: [
                    "Stop inside",
                    "Enter only if exit is clear",
                    "Drive fast",
                    "Ignore markings"
                ],
                answer: 1,
                image: "",
                explanation: "Waa inaad gelisaa sanduuqa huruudka kaliya marka ka bixitaankaaga uu nadiif yahay si aad u ilaaliso gaadiidka kale."
            },
            {
                id: 25,
                category: "CAT03",
                question: "Why should you avoid tailgating?",
                options: [
                    "Uses more fuel",
                    "Reduces stopping distance",
                    "Increases crash risk",
                    "Makes driving easier"
                ],
                answer: 2,
                image: "",
                explanation: "Raacitaanka gaari kale si dhow wuxuu kordhiyaa khatarta shil haddii gaadhigu si kedis ah u istaago."
            },
            {
                id: 26,
                category: "CAT03",
                question: "What should you do if feeling tired while driving?",
                options: [
                    "Open window only",
                    "Drive faster",
                    "Take a break",
                    "Turn music louder"
                ],
                answer: 2,
                image: "",
                explanation: "Haddii aad daal dareento, waa inaad joojisaa oo nasataa maxaa yeelay daalka wuxuu saameeyaa feejignaantaada."
            },
            {
                id: 27,
                category: "CAT04",
                question: "Why should drivers check mirrors before changing lanes?",
                options: [
                    "To see passengers",
                    "To check blind spots",
                    "To clean mirrors",
                    "To check speed"
                ],
                answer: 1,
                image: "",
                explanation: "Hubinta muraayadaha iyo meelaha foolka ka xiran waxay ka hortagtaa shilal marka aad lane beddelayso."
            },
            {
                id: 28,
                category: "CAT04",
                question: "What should drivers do near pedestrians?",
                options: [
                    "Speed up",
                    "Ignore crossings",
                    "Be prepared to stop",
                    "Use horn continuously"
                ],
                answer: 2,
                image: "",
                explanation: "Darawalladu waa inay hoos u dhacaan oo diyaar u noqdaan inay istaagaan marka ay u dhow yihiin lugeeyayaasha."
            },
            {
                id: 29,
                category: "CAT05",
                question: "What does a red octagon sign mean?",
                options: [
                    "Yield",
                    "Stop",
                    "School",
                    "No parking"
                ],
                answer: 1,
                image: "RS001-stop.webp",
                explanation: "Astaanta octagon cas waa calaamad caalami ah oo muujinaysa in darawalku istaago."
            },
            {
                id: 30,
                category: "CAT05",
                question: "What does a triangular warning sign indicate?",
                options: [
                    "Mandatory direction",
                    "Danger ahead",
                    "Parking area",
                    "Motorway"
                ],
                answer: 1,
                image: "",
                explanation: "Calaamadaha saddexagalka ah waxay ka digayaan khataro horay u jira ama xaalado gaar ah oo waddada ah."
            }
        ];

        fetch('questions-full.json')
            .then(response => response.json())
            .then(data => { questions = data; })
            .catch(error => console.error('Error loading questions:', error));

        let mode = '';
        let currentQ = 0;
        let timer = null;
        let timeLeft = 60;
        let answered = false;
        let categoryScores = {};
        let activeQuizQuestions = [];
        let userAnswers = [];
        let currentAudio = null;

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function doLogin() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            if (username === 'fynah' && password === 'Fynah2026!') {
                show('home');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        ['usernameInput', 'passwordInput'].forEach(function(id) {
            document.getElementById(id).addEventListener('keypress', function(e) {
                if (e.key === 'Enter') doLogin();
            });
        });

        function enterPracticeMode() {
            mode = 'practice';
            renderCategoryButtons();
            show('categorySelect');
        }

        function renderCategoryButtons() {
            const categoryButtons = document.getElementById('categoryButtons');
            categoryButtons.innerHTML = '';
            for (const key in categories) {
                const button = document.createElement('button');
                button.className = 'category-btn';
                button.textContent = categories[key];
                button.onclick = function() { choosePracticeCategory(key); };
                categoryButtons.appendChild(button);
            }
        }

        function choosePracticeCategory(categoryKey) {
            activeQuizQuestions = questions.filter(q => q.category === categoryKey);
            userAnswers = new Array(activeQuizQuestions.length).fill(null);
            currentQ = 0;
            categoryScores = {};
            show('quiz');
            loadQ();
        }

        function startQuiz(m) {
            mode = m;
            currentQ = 0;
            categoryScores = {};
            activeQuizQuestions = [...questions].sort(() => Math.random() - 0.5);
            userAnswers = new Array(activeQuizQuestions.length).fill(null);
            show('quiz');
            loadQ();
        }

        function loadQ() {
            const q = activeQuizQuestions[currentQ];
            answered = false;
            document.getElementById('qNum').textContent = 'Q ' + (currentQ + 1) + '/' + activeQuizQuestions.length;
            document.getElementById('cat').textContent = categories[q.category] || q.category;
            document.getElementById('qText').textContent = q.questionEnglish;
            const qImage = document.getElementById('qImage');
            if (q.image && q.image.trim() !== '') {
                qImage.src = 'assets/images/' + q.image;
                qImage.style.display = 'block';
            } else {
                qImage.src = '';
                qImage.style.display = 'none';
            }

            const fb = document.getElementById('feedback');
            fb.className = 'feedback';
            document.getElementById('fbTitle').style.display = 'none';
            document.getElementById('fbText').style.display = 'none';
            document.getElementById('fbText').innerHTML = '';

            if (mode === 'test') {
                timeLeft = 60;
                document.getElementById('timer').style.display = 'inline';
                startTimer();
            } else {
                document.getElementById('timer').style.display = 'none';
                clearInterval(timer);
            }

            let html = '';
            q.optionsEnglish.forEach((opt, i) => {
                html += '<div class="option" onclick="selectAnswer(' + i + ')">';
                html += '<div class="opt-letter">' + String.fromCharCode(65 + i) + '</div>';
                html += '<div class="opt-text">' + opt + '</div>';
                html += '<button class="opt-audio" onclick="event.stopPropagation(); playOpt(' + i + ')">&#128266;</button>';
                html += '</div>';
            });
            document.getElementById('options').innerHTML = html;
            updateOptionSelection();
            updateActionButtons();
        }

        function startTimer() {
            clearInterval(timer);
            updateTimer();
            timer = setInterval(function() {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                }
            }, 1000);
        }

        function updateTimer() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timer').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function selectAnswer(idx) {
            const q = activeQuizQuestions[currentQ];
            userAnswers[currentQ] = idx;
            answered = true;
            if (mode === 'practice') {
                clearInterval(timer);
                const correct = idx === q.answer;
                updateOptionSelection();
                showPracticeFeedback(correct, q);
            } else {
                updateOptionSelection();
                updateActionButtons();
            }
        }

        function updateOptionSelection() {
            const selectedIndex = userAnswers[currentQ];
            const q = activeQuizQuestions[currentQ];
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.remove('selected', 'correct', 'wrong');
                if (selectedIndex === i) {
                    opt.classList.add('selected');
                }
                if (mode === 'practice' && selectedIndex !== null) {
                    if (i === q.answer) {
                        opt.classList.add('correct');
                    } else if (i === selectedIndex) {
                        opt.classList.add('wrong');
                    }
                }
            });
        }

        function showPracticeFeedback(correct, q) {
            const fb = document.getElementById('feedback');
            fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
            const title = document.getElementById('fbTitle');
            const text = document.getElementById('fbText');
            title.style.display = 'block';
            text.style.display = 'block';
            title.textContent = correct ? 'Correct!' : 'Wrong!';
            text.innerHTML = '<strong>Correct Answer:</strong> ' + q.optionsEnglish[q.answer] + '<br><br>' + q.explanationSomali;
            updateActionButtons();
        }

        function updateActionButtons() {
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const finishBtn = document.getElementById('finishBtn');
            nextBtn.style.display = 'none';
            finishBtn.style.display = 'none';

            if (mode === 'practice') {
                if (answered) {
                    feedback.className = feedback.className.includes('show') ? feedback.className : feedback.className + ' show';
                    nextBtn.style.display = 'inline-block';
                } else {
                    feedback.className = 'feedback';
                }
            } else {
                document.getElementById('fbTitle').style.display = 'none';
                document.getElementById('fbText').style.display = 'none';
                if (userAnswers[currentQ] !== null) {
                    feedback.className = 'feedback show';
                    if (currentQ === activeQuizQuestions.length - 1) {
                        finishBtn.style.display = 'inline-block';
                    } else {
                        nextBtn.style.display = 'inline-block';
                    }
                } else {
                    feedback.className = 'feedback';
                }
            }
        }

        function nextQ() {
            if (mode === 'practice' && !answered) return;
            currentQ++;
            if (currentQ >= activeQuizQuestions.length) {
                showResults();
                return;
            }
            answered = false;
            loadQ();
        }

        function finishTest() {
            showResults();
        }

        function showResults() {
            show('results');
            clearInterval(timer);
            const total = activeQuizQuestions.length;
            const score = activeQuizQuestions.reduce((sum, q, index) => {
                return sum + (userAnswers[index] === q.answer ? 1 : 0);
            }, 0);
            const pass = score >= Math.ceil(total * 0.8);
            const wrong = total - score;
            document.getElementById('scoreCircle').textContent = score + '/' + total;
            document.getElementById('scoreCircle').className = 'score-circle ' + (pass ? 'pass' : 'fail');
            document.getElementById('rTitle').textContent = pass ? 'PASSED 🎉' : 'FAILED ❌';
            document.getElementById('rMsg').textContent = 'Correct: ' + score + ' | Wrong: ' + wrong + ' | Total: ' + total;

            const breakdown = {};
            activeQuizQuestions.forEach((q, index) => {
                if (!breakdown[q.category]) {
                    breakdown[q.category] = { correct: 0, total: 0 };
                }
                breakdown[q.category].total++;
                if (userAnswers[index] === q.answer) {
                    breakdown[q.category].correct++;
                }
            });

            let catHtml = '<h3 style="margin-bottom: 15px; color: #1e3c72;">Category Breakdown</h3>';
            for (const cat in breakdown) {
                const cs = breakdown[cat];
                const w = cs.total - cs.correct;
                catHtml += '<div class="cat-result">';
                catHtml += '<div class="cat-name">' + (categories[cat] || cat) + '</div>';
                catHtml += '<div class="cat-stats">';
                catHtml += '<span style="color: #4caf50;">Correct: ' + cs.correct + '</span>';
                catHtml += '<span style="color: #f44336;">Wrong: ' + w + '</span>';
                catHtml += '<span style="color: #666;">Total: ' + cs.total + '</span>';
                catHtml += '</div></div>';
            }
            document.getElementById('categoryResults').innerHTML = catHtml;
        }

        function goHome() {
            clearInterval(timer);
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            show('home');
        }

        function playAudio(src) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(src);
            currentAudio.play().catch(function(e) {
                console.log('Audio error:', e);
            });
        }

        function playQuestion() {
            const q = activeQuizQuestions[currentQ];
            playAudio('audio/q' + q.id + '_question.mp3');
        }

        function playOpt(idx) {
            const q = activeQuizQuestions[currentQ];
            playAudio('audio/q' + q.id + '_opt' + idx + '.mp3');
        }

        show('login');
    </script>
</body>
</html>
