 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ireland Driving Test - Somali Audio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1e3c72; 
            min-height: 100vh; 
            color: #333;
        }
        .container { width: 100%; max-width: 700px; margin: 0 auto; padding: 15px; }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Login */
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 50px;
            text-align: center;
        }
        .login-box h1 { color: #1e3c72; margin-bottom: 10px; font-size: 24px; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #764ba2; }
        .error { color: red; margin-top: 10px; display: none; }

        /* Home */
        .home { text-align: center; padding: 20px 0; }
        .home h1 { color: white; margin-bottom: 20px; }
        .mode-btn {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            cursor: pointer;
        }
        .mode-btn h2 { color: #1e3c72; margin-bottom: 5px; }
        .mode-btn p { color: #666; font-size: 14px; }

        /* Quiz */
        .quiz-header {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back { font-size: 24px; cursor: pointer; padding: 5px; }
        .timer { color: #e74c3c; font-weight: bold; font-size: 20px; }
        .q-card {
            background: white;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .cat {
            background: #e3f2fd;
            color: #1976d2;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .q-text { font-size: 20px; line-height: 1.5; font-weight: bold; margin-bottom: 12px; color: #1e3c72; }
        .q-image { width: 100%; max-height: 250px; object-fit: contain; border-radius: 12px; display: none; margin: 15px 0; }
        .audio-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        .audio-btn,
        .opt-audio {
            width: auto;
        }
        .option {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            min-height: 60px;
        }
        .option:hover { background: #e3f2fd; }
        .opt-letter {
            background: #1e3c72;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .opt-text { flex: 1; }
        .opt-audio {
            background: #ff9800;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 5px;
        }
        .correct { background: #c8e6c9 !important; }
        .wrong { background: #ffcdd2 !important; }

        .feedback {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #c8e6c9; color: #2e7d32; }
        .feedback.wrong { background: #ffcdd2; color: #c62828; }

        /* Results */
        .results { text-align: center; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        .pass { background: #4caf50; }
        .fail { background: #f44336; }

        .cat-result {
            background: #f5f5f5;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            text-align: left;
        }
        .cat-name { font-weight: bold; color: #1e3c72; margin-bottom: 5px; }
        .cat-stats { display: flex; gap: 15px; font-size: 14px; }

        .watermark {
            position: fixed;
            bottom: 5px;
            right: 5px;
            opacity: 0.3;
            font-size: 10px;
            color: white;
            pointer-events: none;
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="watermark">Licensed Driving School</div>

    <div class="container">
        <!-- LOGIN -->
        <div id="login" class="screen active">
            <div class="login-box">
                <h1>Ireland Driving Test</h1>
                <p style="color: #666; margin-bottom: 15px;">Somali Audio Learning</p>
                <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
                <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
                <button onclick="doLogin()">ENTER</button>
                <p id="loginError" class="error">Invalid username or password</p>
            </div>
        </div>

        <!-- HOME -->
        <div id="home" class="screen">
            <h1 style="color: white; text-align: center; margin-bottom: 20px;">Choose Mode</h1>
            <div class="mode-btn" onclick="startQuiz('practice')">
                <h2>Practice Mode</h2>
                <p>No timer. Learn at your own pace.</p>
            </div>
            <div class="mode-btn" onclick="startQuiz('test')">
                <h2>Test Mode</h2>
                <p>10 questions. Results at the end.</p>
            </div>
        </div>

        <!-- QUIZ -->
        <div id="quiz" class="screen">
            <div class="quiz-header">
                    <span class="back" onclick="goHome()">&#8592;</span>
                <span id="qNum">Q 1/10</span>
                <span class="timer" id="timer">01:00</span>
            </div>
            <div class="q-card">
                <span class="cat" id="cat">Category</span>
                <div class="q-text" id="qText">Question</div>
                <img id="qImage" class="q-image" src="" alt="Question image">
                <div style="text-align: center; margin: 15px 0;">
                    <button class="audio-btn" onclick="playQuestion()">Question Audio</button>
                </div>
                <div id="options"></div>
                <div id="feedback" class="feedback">
                    <h3 id="fbTitle">Correct!</h3>
                    <p id="fbText"></p>
                    <button onclick="nextQ()">Next</button>
                </div>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="results" class="screen">
            <div class="q-card">
                <div class="score-circle" id="scoreCircle">0/10</div>
                <h2 id="rTitle">Done!</h2>
                <p id="rMsg"></p>
                <div id="categoryResults" style="margin-top: 20px;"></div>
            </div>
            <button onclick="goHome()">Home</button>
            <button onclick="location.reload()" style="margin-top: 10px;">Restart</button>
        </div>
    </div>

    <script>
        const categories = {
            CAT01: "Control of Vehicle",
            CAT02: "Rules of the Road",
            CAT03: "Managing Risk",
            CAT04: "Safe and Social Responsible Driving",
            CAT05: "Technical Matters"
        };

        const questions = [
            {
                id: 21,
                category: "CAT01",
                question: "What should you check before starting a long journey?",
                options: [
                    "Fuel only",
                    "Tires, oil and lights",
                    "Radio station",
                    "Car color"
                ],
                answer: 1,
                image: "",
                explanation: "Drivers should check tires, oil levels and lights before a long journey to ensure the vehicle is safe."
            },
            {
                id: 22,
                category: "CAT01",
                question: "What can reduce tire grip on wet roads?",
                options: [
                    "Low speed",
                    "Hydroplaning",
                    "Good brakes",
                    "Seatbelts"
                ],
                answer: 1,
                image: "",
                explanation: "Hydroplaning happens when tires lose contact with the road due to water."
            },
            {
                id: 23,
                category: "CAT02",
                question: "What does a continuous white line mean?",
                options: [
                    "Parking allowed",
                    "No overtaking",
                    "Bus lane",
                    "Road ending"
                ],
                answer: 1,
                image: "",
                explanation: "A continuous white line usually means overtaking is not allowed."
            },
            {
                id: 24,
                category: "CAT02",
                question: "What should you do at a yellow box junction?",
                options: [
                    "Stop inside",
                    "Enter only if exit is clear",
                    "Drive fast",
                    "Ignore markings"
                ],
                answer: 1,
                image: "",
                explanation: "Drivers should only enter a yellow box when their exit is clear."
            },
            {
                id: 25,
                category: "CAT03",
                question: "Why should you avoid tailgating?",
                options: [
                    "Uses more fuel",
                    "Reduces stopping distance",
                    "Increases crash risk",
                    "Makes driving easier"
                ],
                answer: 2,
                image: "",
                explanation: "Following too closely increases the risk of collision if traffic stops suddenly."
            },
            {
                id: 26,
                category: "CAT03",
                question: "What should you do if feeling tired while driving?",
                options: [
                    "Open window only",
                    "Drive faster",
                    "Take a break",
                    "Turn music louder"
                ],
                answer: 2,
                image: "",
                explanation: "Drivers should stop and rest when tired because fatigue affects concentration."
            },
            {
                id: 27,
                category: "CAT04",
                question: "Why should drivers check mirrors before changing lanes?",
                options: [
                    "To see passengers",
                    "To check blind spots",
                    "To clean mirrors",
                    "To check speed"
                ],
                answer: 1,
                image: "",
                explanation: "Checking mirrors and blind spots helps avoid collisions when changing lanes."
            },
            {
                id: 28,
                category: "CAT04",
                question: "What should drivers do near pedestrians?",
                options: [
                    "Speed up",
                    "Ignore crossings",
                    "Be prepared to stop",
                    "Use horn continuously"
                ],
                answer: 2,
                image: "",
                explanation: "Drivers should slow down and prepare to stop near pedestrians and crossings."
            },
            {
                id: 29,
                category: "CAT05",
                question: "What does a red octagon sign mean?",
                options: [
                    "Yield",
                    "Stop",
                    "School",
                    "No parking"
                ],
                answer: 1,
                image: "RS001-stop.webp",
                explanation: "A red octagon is the international road sign shape for STOP."
            },
            {
                id: 30,
                category: "CAT05",
                question: "What does a triangular warning sign indicate?",
                options: [
                    "Mandatory direction",
                    "Danger ahead",
                    "Parking area",
                    "Motorway"
                ],
                answer: 1,
                image: "",
                explanation: "Triangular signs are warning signs used to alert drivers to hazards ahead."
            }
        ];

        let mode = '', currentQ = 0, score = 0, timer = null, timeLeft = 60, answered = false;
        let categoryScores = {};
        let currentAudio = null;

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function doLogin() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (username === 'fynah' && password === 'Fynah2026!') {
                show('home');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        ['usernameInput', 'passwordInput'].forEach(function(id) {
            document.getElementById(id).addEventListener('keypress', function(e) {
                if (e.key === 'Enter') doLogin();
            });
        });

        function shuffleQuestions() {
            questions.sort(() => Math.random() - 0.5);
        }

        function startQuiz(m) {
            mode = m;
            currentQ = 0;
            score = 0;
            categoryScores = {};
            shuffleQuestions();
            show('quiz');
            loadQ();
        }

        function loadQ() {
            const q = questions[currentQ];
            answered = false;
            document.getElementById('qNum').textContent = 'Q ' + (currentQ + 1) + '/' + questions.length;
            document.getElementById('cat').textContent = categories[q.category] || q.category;
            document.getElementById('qText').textContent = q.question;
            const qImage = document.getElementById('qImage');
            if (q.image && q.image.trim() !== '') {
                qImage.src = q.image;
                qImage.style.display = 'block';
            } else {
                qImage.src = '';
                qImage.style.display = 'none';
            }
            document.getElementById('feedback').className = 'feedback';

            if (mode === 'test') {
                timeLeft = 60;
                document.getElementById('timer').style.display = 'inline';
                startTimer();
            } else {
                document.getElementById('timer').style.display = 'none';
                clearInterval(timer);
            }

            let html = '';
            q.options.forEach((opt, i) => {
                html += '<div class="option" onclick="select(' + i + ')">';
                html += '<div class="opt-letter">' + String.fromCharCode(65+i) + '</div>';
                html += '<div class="opt-text">' + opt + '</div>';
                html += '<button class="opt-audio" onclick="event.stopPropagation(); playOpt(' + i + ')">&#128266;</button>';
                html += '</div>';
            });
            document.getElementById('options').innerHTML = html;
        }

        function startTimer() {
            clearInterval(timer);
            updateTimer();
            timer = setInterval(function() {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) { clearInterval(timer); if (!answered) select(-1); }
            }, 1000);
        }

        function updateTimer() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timer').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function select(idx) {
            if (answered) return;
            answered = true;
            clearInterval(timer);
            const q = questions[currentQ];
            const correct = idx === q.answer;
            if (correct) score++;

            if (!categoryScores[q.category]) categoryScores[q.category] = { correct: 0, total: 0 };
            categoryScores[q.category].total++;
            if (correct) categoryScores[q.category].correct++;

            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === q.answer) opt.classList.add('correct');
                else if (i === idx && !correct) opt.classList.add('wrong');
            });

            const fb = document.getElementById('feedback');
            fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
            document.getElementById('fbTitle').textContent = correct ? 'Correct!' : 'Wrong!';
            document.getElementById('fbText').innerHTML =
                '<strong>Correct Answer:</strong> ' +
                q.options[q.answer] +
                '<br><br>' +
                q.explanation;
        }

        function nextQ() {
            currentQ++;
            if (currentQ >= questions.length) showResults();
            else loadQ();
        }

        function showResults() {
            show('results');
            const pass = score >= 8;
            const wrong = questions.length - score;
            document.getElementById('scoreCircle').textContent = score + '/' + questions.length;
            document.getElementById('scoreCircle').className = 'score-circle ' + (pass ? 'pass' : 'fail');
            document.getElementById('rTitle').textContent = pass ? 'PASSED 🎉' : 'FAILED ❌';
            document.getElementById('rMsg').textContent = 'Correct: ' + score + ' | Wrong: ' + wrong + ' | Total: ' + questions.length;

            let catHtml = '<h3 style="margin-bottom: 15px; color: #1e3c72;">Category Breakdown</h3>';
            for (let cat in categoryScores) {
                const cs = categoryScores[cat];
                const w = cs.total - cs.correct;
                catHtml += '<div class="cat-result">';
                catHtml += '<div class="cat-name">' + (categories[cat] || cat) + '</div>';
                catHtml += '<div class="cat-stats">';
                catHtml += '<span style="color: #4caf50;">Correct: ' + cs.correct + '</span>';
                catHtml += '<span style="color: #f44336;">Wrong: ' + w + '</span>';
                catHtml += '<span style="color: #666;">Total: ' + cs.total + '</span>';
                catHtml += '</div></div>';
            }
            document.getElementById('categoryResults').innerHTML = catHtml;
        }

        function goHome() {
            clearInterval(timer);
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            show('home');
        }

        // ============ MP3 AUDIO (FILES IN ROOT FOLDER) ============
        function playAudio(src) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(src);
            currentAudio.play().catch(function(e) {
                console.log('Audio error:', e);
            });
        }

        // Play question audio - looks for file in ROOT folder
        function playQuestion() {
            const q = questions[currentQ];
            playAudio('q' + q.id + '_question.mp3');
        }

        // Play option audio - looks for file in ROOT folder
        function playOpt(idx) {
            const q = questions[currentQ];
            playAudio('q' + q.id + '_opt' + idx + '.mp3');
        }

        // Init
        show('login');
    </script>
</body>
</html>
