 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ireland Driving Test - Somali Audio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1e3c72; 
            min-height: 100vh; 
            color: #333;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Login */
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 50px;
            text-align: center;
        }
        .login-box h1 { color: #1e3c72; margin-bottom: 10px; font-size: 24px; }
        .code-hint { 
            background: #e3f2fd; 
            padding: 10px; 
            border-radius: 8px; 
            margin: 15px 0; 
            font-size: 14px; 
            color: #1976d2; 
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #764ba2; }
        .error { color: red; margin-top: 10px; display: none; }

        /* Home */
        .home { text-align: center; padding: 20px 0; }
        .home h1 { color: white; margin-bottom: 20px; }
        .mode-btn {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            cursor: pointer;
        }
        .mode-btn h2 { color: #1e3c72; margin-bottom: 5px; }
        .mode-btn p { color: #666; font-size: 14px; }

        /* Quiz */
        .quiz-header {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back { font-size: 24px; cursor: pointer; padding: 5px; }
        .timer { color: #e74c3c; font-weight: bold; font-size: 20px; }
        .q-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .cat {
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .q-text { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #1e3c72; }
        .audio-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        .option {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .option:hover { background: #e3f2fd; }
        .opt-letter {
            background: #1e3c72;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .opt-text { flex: 1; }
        .opt-audio {
            background: #ff9800;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 5px;
        }
        .correct { background: #c8e6c9 !important; }
        .wrong { background: #ffcdd2 !important; }

        .feedback {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #c8e6c9; color: #2e7d32; }
        .feedback.wrong { background: #ffcdd2; color: #c62828; }

        /* Results */
        .results { text-align: center; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        .pass { background: #4caf50; }
        .fail { background: #f44336; }

        .cat-result {
            background: #f5f5f5;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            text-align: left;
        }
        .cat-name { font-weight: bold; color: #1e3c72; margin-bottom: 5px; }
        .cat-stats { display: flex; gap: 15px; font-size: 14px; }

        .watermark {
            position: fixed;
            bottom: 5px;
            right: 5px;
            opacity: 0.3;
            font-size: 10px;
            color: white;
            pointer-events: none;
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="watermark">Licensed Driving School</div>

    <div class="container">
        <!-- LOGIN -->
        <div id="login" class="screen active">
            <div class="login-box">
                <h1>Ireland Driving Test</h1>
                <p style="color: #666; margin-bottom: 15px;">Somali Audio Learning</p>
                <div class="code-hint">Access Code: <strong>Xarbi1234</strong></div>
                <input type="text" id="codeInput" placeholder="Enter code" autocomplete="off">
                <button onclick="doLogin()">ENTER</button>
                <p id="loginError" class="error">Wrong code</p>
            </div>
        </div>

        <!-- HOME -->
        <div id="home" class="screen">
            <h1 style="color: white; text-align: center; margin-bottom: 20px;">Choose Mode</h1>
            <div class="mode-btn" onclick="startQuiz('practice')">
                <h2>Practice Mode</h2>
                <p>No timer. Learn at your own pace.</p>
            </div>
            <div class="mode-btn" onclick="startQuiz('test')">
                <h2>Test Mode</h2>
                <p>20 questions. Results at the end.</p>
            </div>
        </div>

        <!-- QUIZ -->
        <div id="quiz" class="screen">
            <div class="quiz-header">
                <span class="back" onclick="goHome()">&#8592;</span>
                <span id="qNum">Q 1/20</span>
                <span class="timer" id="timer">01:00</span>
            </div>
            <div class="q-card">
                <span class="cat" id="cat">Category</span>
                <div class="q-text" id="qText">Question</div>
                <div style="text-align: center; margin: 15px 0;">
                    <button class="audio-btn" onclick="playQuestion()">Question Audio</button>
                </div>
                <div id="options"></div>
                <div id="feedback" class="feedback">
                    <h3 id="fbTitle">Correct!</h3>
                    <p id="fbText"></p>
                    <button class="audio-btn" style="background: #1976d2;" onclick="playExplanation()">Explanation</button>
                    <br><br>
                    <button onclick="nextQ()">Next</button>
                </div>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="results" class="screen">
            <div class="q-card">
                <div class="score-circle" id="scoreCircle">0/20</div>
                <h2 id="rTitle">Done!</h2>
                <p id="rMsg"></p>
                <div id="categoryResults" style="margin-top: 20px;"></div>
            </div>
            <button onclick="goHome()">Home</button>
            <button onclick="location.reload()" style="margin-top: 10px;">Restart</button>
        </div>
    </div>

    <script>
        // Questions data
        const questions = [
            {id: 1, cat: "Control of Vehicle", q: "What is the minimum legal tire tread depth?", opts: ["1.0 mm", "1.6 mm", "2.0 mm", "3.0 mm"], ans: 1},
            {id: 2, cat: "Control of Vehicle", q: "In wet conditions, stopping distance should be?", opts: ["Same", "Double", "Triple", "Half"], ans: 1},
            {id: 3, cat: "Control of Vehicle", q: "When should you use fog lights?", opts: ["When raining", "Fog <100m visibility", "At night", "Always"], ans: 1},
            {id: 4, cat: "Control of Vehicle", q: "What is the purpose of the handbrake?", opts: ["Emergency stop", "Hold when parked", "Slow down", "Replace foot brake"], ans: 1},
            {id: 5, cat: "Legal Matters / Rules of the Road", q: "Max speed in built-up area?", opts: ["30 km/h", "50 km/h", "60 km/h", "80 km/h"], ans: 1},
            {id: 6, cat: "Legal Matters / Rules of the Road", q: "Speed limit on national road?", opts: ["80 km/h", "100 km/h", "120 km/h", "140 km/h"], ans: 1},
            {id: 7, cat: "Legal Matters / Rules of the Road", q: "Max speed on motorway?", opts: ["100 km/h", "110 km/h", "120 km/h", "130 km/h"], ans: 2},
            {id: 8, cat: "Legal Matters / Rules of the Road", q: "At unmarked junction, who has priority?", opts: ["Traffic from right", "Traffic from left", "Larger vehicle", "Faster vehicle"], ans: 0},
            {id: 9, cat: "Managing Risk", q: "Safe following distance in dry conditions?", opts: ["1 sec", "2 sec", "4 sec", "10 sec"], ans: 1},
            {id: 10, cat: "Managing Risk", q: "Handheld mobile phone while driving?", opts: ["OK if slow", "Hands-free only", "Never", "At lights"], ans: 2},
            {id: 11, cat: "Managing Risk", q: "What does yellow diamond sign mean?", opts: ["Warning", "Info", "Speed limit", "Stop"], ans: 0},
            {id: 12, cat: "Managing Risk", q: "What does this sign mean?", opts: ["Stop", "Give way", "No parking", "School"], ans: 1},
            {id: 13, cat: "Safe and Social Responsible Driving", q: "Passing cyclist distance?", opts: ["0.5m", "1.0m", "1.5m", "2.0m"], ans: 1},
            {id: 14, cat: "Safe and Social Responsible Driving", q: "Who ensures kids wear seatbelts?", opts: ["Child", "Driver", "Parent", "Police"], ans: 1},
            {id: 15, cat: "Safe and Social Responsible Driving", q: "New driver alcohol limit?", opts: ["0.02%", "0.05%", "0.08%", "0.10%"], ans: 0},
            {id: 16, cat: "Safe and Social Responsible Driving", q: "Approaching school zone?", opts: ["Sound horn", "Maintain speed", "Slow + ready stop", "Overtake"], ans: 2},
            {id: 17, cat: "Technical Matters", q: "What does this sign mean?", opts: ["Stop", "Yield", "No Entry", "Slow"], ans: 0},
            {id: 18, cat: "Technical Matters", q: "What does this sign indicate?", opts: ["Stop ahead", "No entry", "One way", "Road closed"], ans: 1},
            {id: 19, cat: "Technical Matters", q: "At roundabout, who has right of way?", opts: ["Left traffic", "Right traffic", "Entering", "On roundabout"], ans: 3},
            {id: 20, cat: "Technical Matters", q: "Blue circle with white arrow?", opts: ["No turn", "Must turn", "Optional", "Stop"], ans: 1}
        ];

        let mode = '', currentQ = 0, score = 0, timer = null, timeLeft = 60, answered = false;
        let categoryScores = {};
        let currentAudio = null;

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function doLogin() {
            const code = document.getElementById('codeInput').value.trim();
            if (code === 'Xarbi1234') {
                show('home');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        document.getElementById('codeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        function startQuiz(m) {
            mode = m; currentQ = 0; score = 0; categoryScores = {};
            show('quiz'); loadQ();
        }

        function loadQ() {
            const q = questions[currentQ];
            answered = false;
            document.getElementById('qNum').textContent = 'Q ' + (currentQ + 1) + '/' + questions.length;
            document.getElementById('cat').textContent = q.cat;
            document.getElementById('qText').textContent = q.q;
            document.getElementById('feedback').className = 'feedback';

            if (mode === 'test') {
                timeLeft = 60;
                document.getElementById('timer').style.display = 'inline';
                startTimer();
            } else {
                document.getElementById('timer').style.display = 'none';
            }

            let html = '';
            q.opts.forEach((opt, i) => {
                html += '<div class="option" onclick="select(' + i + ')">';
                html += '<div class="opt-letter">' + String.fromCharCode(65+i) + '</div>';
                html += '<div class="opt-text">' + opt + '</div>';
                html += '<button class="opt-audio" onclick="event.stopPropagation(); playOpt(' + i + ')">&#128266;</button>';
                html += '</div>';
            });
            document.getElementById('options').innerHTML = html;
        }

        function startTimer() {
            clearInterval(timer);
            updateTimer();
            timer = setInterval(function() {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) { clearInterval(timer); if (!answered) select(-1); }
            }, 1000);
        }

        function updateTimer() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timer').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function select(idx) {
            if (answered) return;
            answered = true;
            clearInterval(timer);
            const q = questions[currentQ];
            const correct = idx === q.ans;
            if (correct) score++;

            if (!categoryScores[q.cat]) categoryScores[q.cat] = { correct: 0, total: 0 };
            categoryScores[q.cat].total++;
            if (correct) categoryScores[q.cat].correct++;

            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === q.ans) opt.classList.add('correct');
                else if (i === idx && !correct) opt.classList.add('wrong');
            });

            const fb = document.getElementById('feedback');
            fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
            document.getElementById('fbTitle').textContent = correct ? 'Correct!' : 'Wrong!';
            document.getElementById('fbText').textContent = 'Answer: ' + q.opts[q.ans];
        }

        function nextQ() {
            currentQ++;
            if (currentQ >= questions.length) showResults();
            else loadQ();
        }

        function showResults() {
            show('results');
            const pass = score >= 16;
            const wrong = questions.length - score;
            document.getElementById('scoreCircle').textContent = score + '/' + questions.length;
            document.getElementById('scoreCircle').className = 'score-circle ' + (pass ? 'pass' : 'fail');
            document.getElementById('rTitle').textContent = pass ? 'PASSED!' : 'Failed';
            document.getElementById('rMsg').textContent = 'Correct: ' + score + ' | Wrong: ' + wrong + ' | Total: ' + questions.length;

            let catHtml = '<h3 style="margin-bottom: 15px; color: #1e3c72;">Category Breakdown</h3>';
            for (let cat in categoryScores) {
                const cs = categoryScores[cat];
                const w = cs.total - cs.correct;
                catHtml += '<div class="cat-result">';
                catHtml += '<div class="cat-name">' + cat + '</div>';
                catHtml += '<div class="cat-stats">';
                catHtml += '<span style="color: #4caf50;">Correct: ' + cs.correct + '</span>';
                catHtml += '<span style="color: #f44336;">Wrong: ' + w + '</span>';
                catHtml += '<span style="color: #666;">Total: ' + cs.total + '</span>';
                catHtml += '</div></div>';
            }
            document.getElementById('categoryResults').innerHTML = catHtml;
        }

        function goHome() { show('home'); }

        // ============ MP3 AUDIO (FILES IN ROOT FOLDER) ============
        function playAudio(src) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(src);
            currentAudio.play().catch(function(e) {
                console.log('Audio error:', e);
            });
        }

        // Play question audio - looks for file in ROOT folder
        function playQuestion() {
            const q = questions[currentQ];
            playAudio('q' + q.id + '_question.mp3');
        }

        // Play option audio - looks for file in ROOT folder
        function playOpt(idx) {
            const q = questions[currentQ];
            playAudio('q' + q.id + '_opt' + idx + '.mp3');
        }

        // Play explanation audio - looks for file in ROOT folder
        function playExplanation() {
            const q = questions[currentQ];
            playAudio('q' + q.id + '_exp.mp3');
        }

        // Init
        show('login');
    </script>
</body>
</html>
